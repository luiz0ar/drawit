name: CI DevSecOps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend (Rust / Axum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Formatação (rustfmt)
        run: cargo fmt --manifest-path api/Cargo.toml -- --check

      - name: Linter (clippy)
        run: cargo clippy --manifest-path api/Cargo.toml -- -D warnings

      - name: Testes Unitários e Integração
        run: cargo test --manifest-path api/Cargo.toml

  frontend-checks:
    name: Frontend (React / Vite / Bun / pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem de Lint (oxlint)
        run: pnpm --dir web exec oxlint --deny-warnings --format=agent

      - name: Checagem de Tipagem TypeScript e Build
        run: |
          cd web
          bun run build

      - name: Testes Unitários (Vitest)
        run: |
          cd web
          bun run test

